<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASD Traits Prediction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding: 20px;
            background-color: #f8f9fa;
        }
        .form-container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #0d6efd;
            margin-bottom: 30px;
            text-align: center;
        }
        .form-section {
            margin-bottom: 20px;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 5px;
        }
        .form-section h3 {
            color: #0d6efd;
            font-size: 1.2rem;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-10">
                <div class="form-container">
                    <h1>Autism Spectrum Disorder (ASD) Traits Prediction</h1>
                    <form action="/predict" method="post">
                        
                        <div class="form-section">
                            <h3>Basic Information</h3>
                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label for="Age_Years" class="form-label">Age (Years)</label>
                                    <input type="number" class="form-control" id="Age_Years" name="Age_Years" required min="1" max="100">
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label for="Qchat_10_Score" class="form-label">Qchat-10 Score</label>
                                    <input type="number" step="0.1" class="form-control" id="Qchat_10_Score" name="Qchat_10_Score" required min="0" max="10">
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label for="Sex" class="form-label">Sex</label>
                                    <select class="form-select" id="Sex" name="Sex" required>
                                        <option value="">Select...</option>
                                        <option value="M">Male</option>
                                        <option value="F">Female</option>
                                    </select>
                                </div>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label for="Ethnicity" class="form-label">Ethnicity</label>
                                    <select class="form-select" id="Ethnicity" name="Ethnicity" required>
                                        <option value="">Select...</option>
                                        <option value="Middle Eastern">Middle Eastern</option>
                                        <option value="White European">White European</option>
                                        <option value="Hispanic">Hispanic</option>
                                        <option value="Black">Black</option>
                                        <option value="Asian">Asian</option>
                                        <option value="South Asian">South Asian</option>
                                        <option value="Native Indian">Native Indian</option>
                                        <option value="Others">Others</option>
                                        <option value="Latino">Latino</option>
                                        <option value="Mixed">Mixed</option>
                                        <option value="Pacifica">Pacifica</option>
                                        <option value="White-European">White-European</option>
                                        <option value="Turkish">Turkish</option>
                                        <option value="others">Other Ethnicity</option>
                                    </select>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label for="Jaundice" class="form-label">Had Jaundice at Birth?</label>
                                    <select class="form-select" id="Jaundice" name="Jaundice" required>
                                        <option value="">Select...</option>
                                        <option value="Yes">Yes</option>
                                        <option value="No">No</option>
                                    </select>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label for="Family_mem_with_ASD" class="form-label">Family Member with ASD?</label>
                                    <select class="form-select" id="Family_mem_with_ASD" name="Family_mem_with_ASD" required>
                                        <option value="">Select...</option>
                                        <option value="Yes">Yes</option>
                                        <option value="No">No</option>
                                    </select>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="Who_completed_the_test" class="form-label">Who Completed the Test?</label>
                                <select class="form-select" id="Who_completed_the_test" name="Who_completed_the_test" required>
                                    <option value="">Select...</option>
                                    <option value="Family Member">Family Member</option>
                                    <option value="Health Care Professional">Health Care Professional</option>
                                    <option value="Self">Self</option>
                                    <option value="Others">Others</option>
                                    <option value="School and NGO">School and NGO</option>
                                    <option value="Parent">Parent</option>
                                    <option value="Relative">Relative</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="form-section">
                            <h3>Behavioral Questions</h3>
                            <p>For the following questions, please answer with 0 for "No" and 1 for "Yes"</p>
                            
                            <div class="mb-3">
                                <label for="A1" class="form-label">A1. Does your child look at you when you call his/her name?</label>
                                <select class="form-select" id="A1" name="A1" required>
                                    <option value="">Select...</option>
                                    <option value="0">No</option>
                                    <option value="1">Yes</option>
                                </select>
                            </div>
                            
                            <div class="mb-3">
                                <label for="A2" class="form-label">A2. How easy is it for you to get eye contact with your child? (0=Hard, 1=Easy)</label>
                                <select class="form-select" id="A2" name="A2" required>
                                    <option value="">Select...</option>
                                    <option value="0">Hard</option>
                                    <option value="1">Easy</option>
                                </select>
                            </div>
                            
                            <div class="mb-3">
                                <label for="A3" class="form-label">A3. Does your child point to indicate that s/he wants something? (e.g. a toy that is out of reach)</label>
                                <select class="form-select" id="A3" name="A3" required>
                                    <option value="">Select...</option>
                                    <option value="0">No</option>
                                    <option value="1">Yes</option>
                                </select>
                            </div>
                            
                            <div class="mb-3">
                                <label for="A4" class="form-label">A4. Does your child point to share interest with you? (e.g. pointing at an interesting sight)</label>
                                <select class="form-select" id="A4" name="A4" required>
                                    <option value="">Select...</option>
                                    <option value="0">No</option>
                                    <option value="1">Yes</option>
                                </select>
                            </div>
                            
                            <div class="mb-3">
                                <label for="A5" class="form-label">A5. Does your child pretend? (e.g. care for dolls, talk on a toy phone)</label>
                                <select class="form-select" id="A5" name="A5" required>
                                    <option value="">Select...</option>
                                    <option value="0">No</option>
                                    <option value="1">Yes</option>
                                </select>
                            </div>
                            
                            <div class="mb-3">
                                <label for="A6" class="form-label">A6. Does your child follow where you're looking?</label>
                                <select class="form-select" id="A6" name="A6" required>
                                    <option value="">Select...</option>
                                    <option value="0">No</option>
                                    <option value="1">Yes</option>
                                </select>
                            </div>
                            
                            <div class="mb-3">
                                <label for="A7" class="form-label">A7. If you or someone else in the family is visibly upset, does your child show signs of wanting to comfort them? (e.g. stroking hair, hugging them)</label>
                                <select class="form-select" id="A7" name="A7" required>
                                    <option value="">Select...</option>
                                    <option value="0">No</option>
                                    <option value="1">Yes</option>
                                </select>
                            </div>
                            
                            <div class="mb-3">
                                <label for="A8" class="form-label">A8. Would you describe your child's first words as: (0=Delayed, 1=Normal)</label>
                                <select class="form-select" id="A8" name="A8" required>
                                    <option value="">Select...</option>
                                    <option value="0">Delayed</option>
                                    <option value="1">Normal</option>
                                </select>
                            </div>
                            
                            <div class="mb-3">
                                <label for="A9" class="form-label">A9. Does your child use simple gestures? (e.g. wave goodbye)</label>
                                <select class="form-select" id="A9" name="A9" required>
                                    <option value="">Select...</option>
                                    <option value="0">No</option>
                                    <option value="1">Yes</option>
                                </select>
                            </div>
                            
                            <div class="mb-3">
                                <label for="A10" class="form-label">A10. Does your child stare at nothing with no apparent purpose?</label>
                                <select class="form-select" id="A10" name="A10" required>
                                    <option value="">Select...</option>
                                    <option value="0">No</option>
                                    <option value="1">Yes</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">Predict ASD Traits</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
